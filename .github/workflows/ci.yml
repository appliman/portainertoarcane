name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore PortainerToArcane.slnx
      - run: dotnet build PortainerToArcane.slnx --no-restore --configuration Release
      - run: dotnet test PortainerToArcane.slnx --no-build --configuration Release
      - run: dotnet pack src/PortainerToArcane/PortainerToArcane.csproj --no-build --configuration Release --output artifacts
